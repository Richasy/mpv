name: libmpv

on:
  workflow_dispatch:
    inputs:
      build_x64:
        description: 'Build x64'
        type: boolean
        default: true
      build_arm64:
        description: 'Build ARM64 (Azure or local release publication)'
        type: boolean
        default: false
      upload_target:
        description: 'Upload target'
        type: choice
        options:
          - local
          - github
          - azure
          - both
        default: github
      runner:
        description: 'Runner selection (auto uses the Beijing-time schedule)'
        type: choice
        options:
          - auto
          - new
          - legacy
        default: auto

concurrency:
  group: ${{ github.workflow }}-shared-native-build
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      runner_label: ${{ steps.select-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          python3 ci/publish_native_release.py matrix \
            --build-x64 "${{ inputs.build_x64 }}" \
            --build-arm64 "${{ inputs.build_arm64 }}" \
            --upload-target "${{ inputs.upload_target }}" >> "$GITHUB_OUTPUT"

      - id: select-runner
        env:
          RUNNER_SELECTION: ${{ inputs.runner }}
          UPLOAD_TARGET: ${{ inputs.upload_target }}
          NATIVE_RELEASE_ROOT: ${{ vars.NATIVE_RELEASE_ROOT }}
        run: |
          if [ "$UPLOAD_TARGET" = local ]; then
            if [ -z "$NATIVE_RELEASE_ROOT" ] || [ "$RUNNER_SELECTION" = legacy ]; then
              echo "::error::Local publication requires NATIVE_RELEASE_ROOT on the new shared host."
              exit 1
            fi
            RUNNER_SELECTION=new
          fi
          case "${RUNNER_SELECTION:-auto}" in
            new)
              label=mpv-build-wsl-cpc-anran-fhr6h
              ;;
            legacy)
              label=mpv-build-legacy
              ;;
            auto)
              hour=$(TZ=Asia/Shanghai date +%H)
              # Beijing 06:00-14:59 uses the legacy runner; do not fall back if busy.
              if (( 10#$hour >= 6 && 10#$hour < 15 )); then
                label=mpv-build-legacy
              else
                label=mpv-build-wsl-cpc-anran-fhr6h
              fi
              echo "Beijing hour $hour"
              ;;
            *)
              echo "::error::Unknown native runner selection."
              exit 1
              ;;
          esac
          echo "Runner selection ${RUNNER_SELECTION:-auto}: $label"
          echo "label=$label" >> "$GITHUB_OUTPUT"

  setup-local-feed:
    if: ${{ !inputs.build_x64 && !inputs.build_arm64 && inputs.runner == 'new' }}
    runs-on: [self-hosted, Linux, X64, mpv-build-wsl-cpc-anran-fhr6h]
    env:
      NATIVE_RELEASE_ROOT: ${{ vars.NATIVE_RELEASE_ROOT }}
      WINDOWS_NATIVE_FEED_SOURCE: ${{ vars.WINDOWS_NATIVE_FEED_SOURCE }}
    steps:
      - name: Persist the single-directory Windows native feed mount
        run: |
          set -euo pipefail
          if [[ ! "$NATIVE_RELEASE_ROOT" =~ ^/mnt/[a-zA-Z0-9._-]+$ ||
                ! "$WINDOWS_NATIVE_FEED_SOURCE" =~ ^[a-zA-Z]:\\[a-zA-Z0-9._\\-]+$ ]]; then
            echo "::error::Configure canonical Windows and WSL native feed roots."
            exit 1
          fi
          if grep -Eq '^[[:space:]]*mountFsTab[[:space:]]*=[[:space:]]*false' /etc/wsl.conf; then
            echo "::error::WSL fstab processing is disabled."
            exit 1
          fi
          options="metadata,uid=$(id -u),gid=$(id -g)"
          entry="$(printf '%s' "$WINDOWS_NATIVE_FEED_SOURCE" | sed 's/\\/\\\\/g') $NATIVE_RELEASE_ROOT drvfs $options 0 0"
          sudo -n mkdir -p "$NATIVE_RELEASE_ROOT"
          if ! mountpoint -q "$NATIVE_RELEASE_ROOT"; then
            sudo -n mount -t drvfs "$WINDOWS_NATIVE_FEED_SOURCE" "$NATIVE_RELEASE_ROOT" -o "$options"
          fi
          if [ "$(findmnt -T "$NATIVE_RELEASE_ROOT" -no SOURCE)" != "$WINDOWS_NATIVE_FEED_SOURCE" ]; then
            echo "::error::The native feed mount does not point to the configured Windows directory."
            exit 1
          fi
          if ! sudo -n grep -Fxq -- "$entry" /etc/fstab; then
            if sudo -n awk -v path="$NATIVE_RELEASE_ROOT" '$2 == path { found = 1 } END { exit !found }' /etc/fstab; then
              echo "::error::A different persistent native feed mount already exists."
              exit 1
            fi
            printf '%s\n' "$entry" | sudo -n tee -a /etc/fstab >/dev/null
          fi
          test -r "$NATIVE_RELEASE_ROOT/.native-feed-windows-probe"
          test -w "$NATIVE_RELEASE_ROOT"
          printf 'native-feed-wsl=%s\n' "$GITHUB_RUN_ID" > "$NATIVE_RELEASE_ROOT/.native-feed-wsl-probe"

  build:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}'
    runs-on: [self-hosted, Linux, X64, "${{ needs.prepare.outputs.runner_label }}"]
    strategy:
      fail-fast: false
      # Both architectures share dependency sources and compiler caches.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CLANG_ROOT: /home/richasy/programs/clang_root
      SRC_PACKAGES: /home/richasy/programs/src_packages
      RUSTUP_LOC: /home/richasy/programs/clang_root/install_rustup
      OUTPUT_DIR: /home/richasy/programs/libmpv-output
      BUILD_DIR: /home/richasy/programs/build_${{ matrix.arch }}
      TARGET_ARCH: ${{ matrix.arch }}
      MPV_REPO: https://github.com/Richasy/mpv.git
      MPV_COMMIT: ${{ github.sha }}
      NATIVE_RELEASE_ROOT: ${{ vars.NATIVE_RELEASE_ROOT }}
    steps:
      - uses: actions/checkout@v4

      - name: Test immutable local native publication
        run: python3 -B -m unittest discover -s ci/tests -p test_native_release.py

      - name: Validate shared native destination
        if: inputs.upload_target == 'local'
        run: |
          test -d "$NATIVE_RELEASE_ROOT"
          test -w "$NATIVE_RELEASE_ROOT"
          case "$NATIVE_RELEASE_ROOT/" in
            "$GITHUB_WORKSPACE/"*|"$RUNNER_TEMP/"*)
              echo "::error::The native feed must live outside Actions checkout and temporary directories."
              exit 1
              ;;
          esac

      - name: Test D3D11 adapter selector
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I. \
            test/d3d11_adapter.c video/out/gpu/d3d11_adapter.c \
            -o /tmp/d3d11-adapter-test
          /tmp/d3d11-adapter-test

      - name: Test D3D11 VSR policy
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I. \
            test/d3d11vpp_vsr_policy_test.c \
            video/filter/d3d11vpp_vsr_policy.c \
            -o /tmp/d3d11vpp-vsr-policy-test
          /tmp/d3d11vpp-vsr-policy-test

      - name: Test DLSSNR parameters and color matrices
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            video/filter/dlssnr/test_params.c video/filter/dlssnr/params.c \
            -lm -o /tmp/dlssnr-params-test
          /tmp/dlssnr-params-test

      - name: Test RIFE synchronization policy
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I. \
            test/rife_sync.c -o /tmp/rife-sync-test
          /tmp/rife-sync-test
          cc -std=c11 -Wall -Wextra -Werror -I. \
            test/rife_model.c -o /tmp/rife-model-test
          /tmp/rife-model-test

      - name: Test subtitle translation policy
        if: matrix.arch == 'x86_64'
        run: |
          mkdir -p build/preflight
          cc -std=c11 -Wall -Wextra -Werror -I. \
            test/sub_translate_policy.c player/sub_translate_policy.c \
            -o build/preflight/sub-translate-policy-test
          build/preflight/sub-translate-policy-test

      - name: Ensure PATH includes local bin
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build libmpv for ${{ matrix.name }}
        env:
          GIT_AUTHOR_NAME: libmpv CI
          GIT_AUTHOR_EMAIL: libmpv-ci@localhost
          GIT_COMMITTER_NAME: libmpv CI
          GIT_COMMITTER_EMAIL: libmpv-ci@localhost
        run: |
          export MPV_SRC_DIR="$GITHUB_WORKSPACE"
          bash ci/build-libmpv.sh all

      - name: Print failed C++ runtime build diagnostics
        if: failure()
        run: |
          shopt -s nullglob
          for log in "$BUILD_DIR"/toolchain/llvm-libcxx-prefix/src/llvm-libcxx-stamp/*-build-*.log; do
            if [ -s "$log" ]; then
              echo "::group::$(basename "$log")"
              tail -n 80 "$log"
              echo "::endgroup::"
            fi
          done
          if [ -f "$SRC_PACKAGES/llvm/libunwind/src/Unwind-seh.cpp" ]; then
            echo "::group::Cached LLVM unwind source"
            git -C "$SRC_PACKAGES/llvm" rev-parse HEAD
            git -C "$SRC_PACKAGES/llvm" diff -- libunwind/src/Unwind-seh.cpp | sed -n '1,100p'
            grep -n -A 8 -B 4 -E 'ExceptionExecuteHandler|EXCEPTION_DISPOSITION|ms_act =' \
              "$SRC_PACKAGES/llvm/libunwind/src/Unwind-seh.cpp" | sed -n '1,120p'
            echo "::endgroup::"
          fi

      - name: Package artifacts as 7z
        if: inputs.upload_target != 'local'
        run: |
          archive="$OUTPUT_DIR/libmpv-${{ matrix.name }}.7z"
          staging="${archive}.new"
          rm -f "$staging"
          cd "$OUTPUT_DIR/${{ matrix.arch }}"
          7z a -t7z -mx=9 "$staging" .
          mv -f "$staging" "$archive"
          ls -lh "$archive"

      - name: Stage immutable local runtime
        if: inputs.upload_target == 'local'
        run: |
          python3 ci/publish_native_release.py stage \
            --root "$NATIVE_RELEASE_ROOT" \
            --source "$OUTPUT_DIR/$TARGET_ARCH" \
            --architecture "${{ matrix.name }}" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "$GITHUB_SHA"

      - name: Upload to GitHub Artifacts
        if: inputs.upload_target == 'github' || inputs.upload_target == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ matrix.name }}
          path: ${{ env.OUTPUT_DIR }}/libmpv-${{ matrix.name }}.7z
          retention-days: 30
          compression-level: 0

      - name: Upload libmpv-2.dll to Azure Blob
        if: inputs.upload_target == 'azure' || inputs.upload_target == 'both'
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          ARCH_OUT="$OUTPUT_DIR/${{ matrix.arch }}"
          AZ_DIR="native/${{ matrix.name }}"
          BUILD_BLOB_DIR="native/builds/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${{ matrix.name }}"
          SYMBOL_DIR="symbols/${{ github.sha }}/${{ matrix.name }}"
          DLL_PATH="$ARCH_OUT/libmpv-2.dll"
          if [ ! -f "$DLL_PATH" ]; then
            echo "ERROR: libmpv-2.dll not found at $DLL_PATH"
            exit 1
          fi
          upload() {
            local file="$1"
            local blob_dir="${2:-$AZ_DIR}"
            local name attempt delay
            name=$(basename "$file")
            for attempt in 1 2 3; do
              echo "Uploading $name to $blob_dir (attempt $attempt/3)..."
              if az storage blob upload \
                --container-name rodel-player-deps \
                --name "$blob_dir/$name" \
                --file "$file" \
                --overwrite \
                --connection-string "$AZURE_STORAGE_CONNECTION_STRING"; then
                echo "Uploaded: $blob_dir/$name"
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to upload $blob_dir/$name after 3 attempts."
                return 1
              fi
              delay=$((attempt * 30))
              echo "::warning::Upload failed; retrying in ${delay}s."
              sleep "$delay"
            done
          }
          # Publish the same complete runtime set to stable and run-specific paths.
          # Dependent shared libraries must accompany libmpv-2.dll.
          shopt -s nullglob
          for f in "$ARCH_OUT"/*.dll "$ARCH_OUT"/*.pdb "$ARCH_OUT"/*.txt; do
            upload "$f"
            if [ "${{ inputs.build_x64 }}" = "true" ] &&
               [ "${{ inputs.build_arm64 }}" = "true" ]; then
              upload "$f" "$BUILD_BLOB_DIR"
            fi
          done
          # Preserve exact DLL/PDB pairs by commit so future customer dumps
          # remain symbolizable after the stable native path is overwritten.
          for name in libmpv-2.dll libmpv-2.pdb build-info.txt; do
            if [ ! -f "$ARCH_OUT/$name" ]; then
              echo "ERROR: required symbol artifact missing: $name"
              exit 1
            fi
            upload "$ARCH_OUT/$name" "$SYMBOL_DIR"
          done

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.name }}
          path: |
            ${{ env.BUILD_DIR }}/toolchain/llvm-libcxx-prefix/src/llvm-libcxx-stamp/*.log
            ${{ env.BUILD_DIR }}/packages/*-prefix/src/*-stamp/*.log
            ${{ env.BUILD_DIR }}/packages/mpv-prefix/src/mpv-build/meson-logs/*.txt
            ${{ env.BUILD_DIR }}/packages/ffmpeg-prefix/src/ffmpeg-build/ffbuild/config.log
            ${{ env.BUILD_DIR }}/packages/whisper-prefix/src/whisper-build/CMakeFiles/CMakeOutput.log
            ${{ env.BUILD_DIR }}/packages/whisper-prefix/src/whisper-build/CMakeFiles/CMakeError.log
          retention-days: 7

  publish-local:
    needs: [prepare, build]
    if: >-
      needs.build.result == 'success' &&
      inputs.build_x64 && inputs.build_arm64 &&
      inputs.upload_target == 'local'
    runs-on: [self-hosted, Linux, X64, "${{ needs.prepare.outputs.runner_label }}"]
    env:
      NATIVE_RELEASE_ROOT: ${{ vars.NATIVE_RELEASE_ROOT }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish latest complete local runtime
        run: |
          python3 ci/publish_native_release.py complete \
            --root "$NATIVE_RELEASE_ROOT" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "$GITHUB_SHA"

  publish-latest:
    needs: [prepare, build]
    if: >-
      needs.build.result == 'success' &&
      inputs.build_x64 && inputs.build_arm64 &&
      (inputs.upload_target == 'azure' || inputs.upload_target == 'both')
    runs-on: [self-hosted, Linux, X64, "${{ needs.prepare.outputs.runner_label }}"]
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - name: Publish latest complete Azure build
        run: |
          set -euo pipefail
          info=$(mktemp)
          marker=$(mktemp)
          trap 'rm -f "$info" "$marker"' EXIT
          for arch in x64 arm64; do
            required=(
              libmpv-2.dll libmpv-2.pdb build-info.txt
              ggml-base.dll ggml.dll ggml-cpu.dll ggml-vulkan.dll libwhisper.dll
              DirectML.dll onnxruntime.dll onnxruntime_providers_shared.dll
              AVS-THIRD-PARTY-NOTICES.txt GPL-2.0.txt GPL-3.0.txt
              UAVS3D-BSD-3-Clause.txt
            )
            if [ "$arch" = x64 ]; then
              required+=(mpv-nvngx.dll)
            fi
            selected=""
            for ((attempt=GITHUB_RUN_ATTEMPT; attempt>=1; attempt--)); do
              candidate="native/builds/${GITHUB_RUN_ID}-${attempt}/$arch"
              complete=true
              for name in "${required[@]}"; do
                exists=$(az storage blob exists \
                  --container-name rodel-player-deps \
                  --name "$candidate/$name" \
                  --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
                  --query exists --output tsv)
                if [ "${exists,,}" != "true" ]; then
                  complete=false
                  break
                fi
              done
              if [ "$complete" = true ]; then
                selected="$candidate"
                break
              fi
            done
            if [ -z "$selected" ]; then
              echo "::error::No complete $arch Azure native set for workflow run $GITHUB_RUN_ID"
              exit 1
            fi
            az storage blob download \
              --container-name rodel-player-deps \
              --name "$selected/build-info.txt" \
              --file "$info" --overwrite --no-progress \
              --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
              --output none
            if ! grep -Fxq "mpv_commit=$GITHUB_SHA" "$info"; then
              echo "::error::Azure $arch build provenance differs from $GITHUB_SHA"
              exit 1
            fi
            if [ "$arch" = x64 ]; then
              x64_path="$selected"
            else
              arm64_path="$selected"
            fi
          done
          printf '{"schemaVersion":2,"mpvCommit":"%s","buildPaths":{"x64":"%s","arm64":"%s"}}\n' \
            "$GITHUB_SHA" "$x64_path" "$arm64_path" > "$marker"
          az storage blob upload \
            --container-name rodel-player-deps \
            --name native/latest.json \
            --file "$marker" --overwrite \
            --content-type application/json \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
            --output none
          echo "Published latest complete Azure native build: x64=$x64_path arm64=$arm64_path ($GITHUB_SHA)"
