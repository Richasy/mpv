name: libmpv

on:
  push:
    branches:
      - master
      - ci
      - libmpv-ci
      - 'release/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      VS: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Community"
      CC: "ccache clang"
      CXX: "ccache clang++"
      CC_LD: "lld-link"
      CXX_LD: "lld-link"
      RUST_LD: "lld-link"
      WINDRES: "llvm-rc"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: "${{ github.workspace }}\\.ccache"
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Disable autocrlf
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6

      - name: Get time
        id: get_time
        run: |
          "timestamp=$((Get-Date).Ticks)" >> $env:GITHUB_OUTPUT

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: libmpv-${{ matrix.target }}-${{ steps.get_time.outputs.timestamp }}
          restore-keys: libmpv-${{ matrix.target }}-

      - name: Install dependencies
        run: |
          python -m pip install meson==1.9.2 ninja
          if (-not (Get-Command ccache -ErrorAction SilentlyContinue)) {
            winget install ccache --accept-source-agreements --accept-package-agreements
          }
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            winget install nasm --accept-source-agreements --accept-package-agreements
          }
          rustup default nightly

      - name: Update Meson WrapDB
        run: |
          meson wrap update-db
          meson wrap install expat
          meson wrap install harfbuzz
          meson wrap install libpng
          meson wrap install zlib

      - name: Build
        id: build
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne 'C:\Program Files\LLVM\bin' -and `
                                                             $_ -ne 'C:\Program Files\CMake\bin' -and `
                                                             $_ -ne 'C:\Strawberry\c\bin' }) -join ';'
          $env:PATH += ';C:\Program Files\NASM'
          Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $env:VS -SkipAutomaticLocation -DevCmdArguments "-arch=${{ matrix.arch }} -host_arch=x64"
          ./ci/build-libmpv.ps1

      - name: Print build log
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          cat ./build/meson-logs/meson-log.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: libmpv-${{ matrix.target }}
          path: |
            build/libmpv-2.dll
            build/libmpv-2.lib
            build/mpv.lib
            include/mpv/*.h

      - name: Save Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: libmpv-${{ matrix.target }}-${{ steps.get_time.outputs.timestamp }}
