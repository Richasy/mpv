name: libmpv

on:
  workflow_dispatch:
    inputs:
      build_x64:
        description: 'Build x64'
        type: boolean
        default: true
      build_arm64:
        description: 'Build ARM64'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          entries=()
          if [ "${{ inputs.build_x64 }}" = "true" ]; then
            entries+=('{"arch":"x86_64","name":"x64"}')
          fi
          if [ "${{ inputs.build_arm64 }}" = "true" ]; then
            entries+=('{"arch":"aarch64","name":"arm64"}')
          fi
          matrix="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}'
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CLANG_ROOT: /home/richasy/programs/clang_root
      SRC_PACKAGES: /home/richasy/programs/src_packages
      RUSTUP_LOC: /home/richasy/programs/clang_root/install_rustup
      OUTPUT_DIR: /home/richasy/programs/libmpv-output
      BUILD_DIR: /home/richasy/programs/build_${{ matrix.arch }}
      TARGET_ARCH: ${{ matrix.arch }}
      MPV_REPO: https://github.com/Richasy/mpv.git
      MPV_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure PATH includes local bin
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build libmpv for ${{ matrix.name }}
        run: |
          export MPV_SRC_DIR="$GITHUB_WORKSPACE"
          bash ci/build-libmpv.sh all

      - name: Package artifacts as 7z
        run: |
          cd "$OUTPUT_DIR/${{ matrix.arch }}"
          7z a -t7z -mx=9 "$OUTPUT_DIR/libmpv-${{ matrix.name }}.7z" .
          echo "Packaged archive:"
          ls -lh "$OUTPUT_DIR/libmpv-${{ matrix.name }}.7z"

      - name: Install Azure CLI
        run: |
          if command -v az &>/dev/null; then
            echo "Azure CLI is already installed."
          else
            echo "Installing Azure CLI..."
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi

      - name: Upload to Azure
        id: azure-upload
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "Azure upload attempt $attempt/3..."
            if az storage blob upload \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
              --container-name github-actions-artifacts \
              --name "${{ github.event.repository.name }}/${{ github.run_id }}/libmpv-${{ matrix.name }}.7z" \
              --file "$OUTPUT_DIR/libmpv-${{ matrix.name }}.7z" \
              --overwrite true \
              --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"; then
              echo "Azure upload succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, waiting 10s before retry..."
            sleep 10
          done
          echo "All Azure upload attempts failed"
          exit 1

      - name: Fallback - Upload to GitHub Artifacts
        if: steps.azure-upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ matrix.name }}
          path: ${{ env.OUTPUT_DIR }}/libmpv-${{ matrix.name }}.7z
          retention-days: 30
