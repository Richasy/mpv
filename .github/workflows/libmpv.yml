name: libmpv

on:
  workflow_dispatch:
    inputs:
      build_x64:
        description: 'Build x64'
        type: boolean
        default: true
      build_arm64:
        description: 'Build ARM64'
        type: boolean
        default: true
      upload_target:
        description: 'Upload target'
        type: choice
        options:
          - github
          - azure
          - both
        default: github
      build_type:
        description: 'Build type (release = -O3 LTO + PDB; debug = -O0 no-LTO, asserts on, PDB)'
        type: choice
        options:
          - release
          - debug
        default: release

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          entries=()
          if [ "${{ inputs.build_x64 }}" = "true" ]; then
            entries+=('{"arch":"x86_64","name":"x64"}')
          fi
          if [ "${{ inputs.build_arm64 }}" = "true" ]; then
            entries+=('{"arch":"aarch64","name":"arm64"}')
          fi
          matrix="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}'
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CLANG_ROOT: /home/richasy/programs/clang_root
      SRC_PACKAGES: /home/richasy/programs/src_packages
      RUSTUP_LOC: /home/richasy/programs/clang_root/install_rustup
      OUTPUT_DIR: /home/richasy/programs/libmpv-output
      BUILD_DIR: /home/richasy/programs/build_${{ matrix.arch }}
      TARGET_ARCH: ${{ matrix.arch }}
      MPV_REPO: https://github.com/Richasy/mpv.git
      MPV_COMMIT: ${{ github.sha }}
      BUILD_TYPE: ${{ inputs.build_type }}
      BUILD_SUFFIX: ${{ inputs.build_type == 'debug' && '-debug' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure PATH includes local bin
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build libmpv for ${{ matrix.name }}
        run: |
          export MPV_SRC_DIR="$GITHUB_WORKSPACE"
          bash ci/build-libmpv.sh all

      - name: Upload to GitHub Artifacts
        if: inputs.upload_target == 'github' || inputs.upload_target == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-${{ matrix.name }}${{ env.BUILD_SUFFIX }}
          path: ${{ env.OUTPUT_DIR }}/${{ matrix.arch }}/
          retention-days: 30
          compression-level: 6

      - name: Upload libmpv-2.dll to Azure Blob
        if: inputs.upload_target == 'azure' || inputs.upload_target == 'both'
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          DLL_PATH="$OUTPUT_DIR/${{ matrix.arch }}/libmpv-2.dll"
          PDB_PATH="$OUTPUT_DIR/${{ matrix.arch }}/libmpv-2.pdb"
          AZ_DIR="native/${{ matrix.name }}${BUILD_SUFFIX}"
          if [ ! -f "$DLL_PATH" ]; then
            echo "ERROR: libmpv-2.dll not found at $DLL_PATH"
            exit 1
          fi
          echo "Uploading libmpv-2.dll for ${{ matrix.name }}${BUILD_SUFFIX} to Azure Blob..."
          az storage blob upload \
            --container-name rodel-player-deps \
            --name "$AZ_DIR/libmpv-2.dll" \
            --file "$DLL_PATH" \
            --overwrite \
            --connection-string "$AZURE_STORAGE_CONNECTION_STRING"
          echo "Uploaded: $AZ_DIR/libmpv-2.dll"
          if [ -f "$PDB_PATH" ]; then
            echo "Uploading libmpv-2.pdb..."
            az storage blob upload \
              --container-name rodel-player-deps \
              --name "$AZ_DIR/libmpv-2.pdb" \
              --file "$PDB_PATH" \
              --overwrite \
              --connection-string "$AZURE_STORAGE_CONNECTION_STRING"
            echo "Uploaded: $AZ_DIR/libmpv-2.pdb"
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.name }}
          path: |
            ${{ env.BUILD_DIR }}/packages/mpv-prefix/src/mpv-stamp/*.log
            ${{ env.BUILD_DIR }}/packages/mpv-prefix/src/mpv-build/meson-logs/*.txt
            ${{ env.BUILD_DIR }}/packages/ffmpeg-prefix/src/ffmpeg-stamp/*.log
          retention-days: 7
